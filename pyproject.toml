[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vintage-estimator"
version = "0.1.0"
description = "Оценка антиквариата по фото"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "gdown>=6.4.1",
    "ipykernel>=7.4.0",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vintage-estimator = "vintage_estimator.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
