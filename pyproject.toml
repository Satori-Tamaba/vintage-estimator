[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vintage-estimator"
version = "0.1.0"
description = "Оценка антиквариата по фото"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "gdown>=6.4.1",
    "ipykernel>=7.4.0",
    "numpy>=1.26",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
serve = ["uvicorn[standard]>=0.29"]

[project.scripts]
vintage-estimator = "vintage_estimator.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
